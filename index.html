<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://clockwise-sync.clockwise-sync.workers.dev wss://clockwise-sync.clockwise-sync.workers.dev http://localhost:8787 ws://localhost:8787; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Clockwise</title>
  <meta name="description" content="Time tracking for your working hours">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clockwise">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/views.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div class="status-shield" aria-hidden="true"></div>
  <div class="compact-bar" inert>
    <div class="compact-inner"><span id="compactTitle"></span><div id="compactRight"></div></div>
  </div>

  <header class="top">
    <div><small id="subtitle"></small><h1 id="title"></h1></div>
    <div id="headRight"></div>
  </header>

  <div id="banner"></div>
  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Heute</span></button>
    <button data-tab="month"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Monat</span></button>
    <button data-tab="year"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Jahr</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Einstellungen</span></button>
  </nav>

  <dialog id="dialog"></dialog>
</body>
</html>
